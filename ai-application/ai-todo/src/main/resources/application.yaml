spring:
  application:
    name: ai-todo
  # Database Configuration
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:todo}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: TodoPool
  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
  # Flyway Migration Configuration
  flyway:
    enabled: true
    locations: classpath:db/migration
    table: flyway_schema_history
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true
    clean-disabled: true
    out-of-order: false
  # Spring AI Configuration
  ai:
    chat:
      client:
        enabled: true
        tool-search-advisor:
          enabled: true
          tool-index-type: lucene
          max-results: 3
          reference-tool-name-accumulation: true
    openai:
      api-key: ${CHAT_KEY}
      base-url: ${CHAT_BASE_URL}
      chat:
        model: ${CHAT_MODEL}
        temperature: 0.2
        max-completion-tokens: 2048
      timeout: 120s
    # SafeGuard Configuration
    advisor:
      safeguard:
        blocked-words:
          - env
    # MCP Client Configuration
    mcp:
      client:
        enabled: true
        type: SYNC
        initialized: true
        request-timeout: 30s
        stdio:
          servers-configuration: classpath:servers.json
# Security Configuration
security:
  keys:
    private-key-path: ${PRIVATE_KEY_PATH}
    public-key-path: ${PUBLIC_KEY_PATH}
  access-token:
    expiration: ${ACCESS_TOKEN_EXPIRATION:900}
  token:
    issuer: ${TOKEN_ISSUER:todo}
# Todo Configuration
todo:
  cors:
    allowed-origins:
      - "${CORS_ALLOWED_ORIGIN:http://localhost:5137}"
    allowed-methods:
      - GET
      - POST
      - PUT
      - DELETE
      - PATCH
      - OPTIONS
    allowed-headers:
      - "*"
    allow-credentials: true
# Token Logging Configuration
token-log:
  dir: track
  prefix: track
  preview-length: 200
# Logging
logging:
  level:
    org.springframework.ai.mcp: DEBUG
    io.modelcontextprotocol: DEBUG
