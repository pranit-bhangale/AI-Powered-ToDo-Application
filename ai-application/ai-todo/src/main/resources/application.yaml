spring:
  application:
    name: ai-todo
  # Database Configuration
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:todo}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: TodoPool
  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
  # Flyway Migration Configuration
  flyway:
    enabled: true
    locations: classpath:db/migration
    table: flyway_schema_history
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true
    clean-disabled: true
    out-of-order: false
  ai:
    chat:
      client:
        enabled: false
        tool-search-advisor:
          enabled: false
          tool-index-type: lucene
          max-results: 3
          reference-tool-name-accumulation: true
    openai:
      api-key: ${CHAT_KEY}
      base-url: ${CHAT_BASE_URL}
      chat:
        model: ${CHAT_MODEL}
        temperature: 0.2
        max-completion-tokens: 2048
      timeout: 120s
    mcp:
      client:
        stdio:
          servers-configuration: classpath:servers.json
security:
  keys:
    private-key-path: ${PRIVATE_KEY_PATH}
    public-key-path: ${PUBLIC_KEY_PATH}
  access-token:
    expiration: ${ACCESS_TOKEN_EXPIRATION}
  token:
    issuer: ${TOKEN_ISSUER}
todo:
  cors:
    allowed-origins:
      - ${CORS_ALLOWED_ORIGIN}
    allowed-methods:
      - GET
      - POST
      - PUT
      - DELETE
      - PATCH
      - OPTIONS
    allowed-headers:
      - "*"
    allow-credentials: true
  token-log:
    dir: track
  prefix: track
  preview-length: 200